apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-config
data:
  FORGEJO__server__DOMAIN: git.amiolas.net
  FORGEJO__server__ROOT_URL: https://git.amiolas.net/
  FORGEJO__server__HTTP_PORT: "3000"
  FORGEJO__server__APP_DATA_PATH: /data
  FORGEJO__database__DB_TYPE: sqlite3
  FORGEJO__database__PATH: /data/forgejo.db
  FORGEJO__security__INSTALL_LOCK: "true"
  FORGEJO__service__DISABLE_REGISTRATION: "true"
  FORGEJO__actions__ENABLED: "false"
  FORGEJO__repository__ROOT: /data/git
  FORGEJO__indexer__REPO_INDEXER_ENABLED: "false"
  FORGEJO__session__PROVIDER: file
  FORGEJO__session__PROVIDER_CONFIG: /data/sessions
  FORGEJO__attachment__PATH: /data/attachments
