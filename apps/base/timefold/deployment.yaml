apiVersion: apps/v1
kind: Deployment
metadata:
  name: timefold
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: timefold
  template:
    metadata:
      labels:
        app: timefold
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: timefold
          image: ghcr.io/leafone13/yaya:v0.8.4
          securityContext:
            readOnlyRootFilesystem: true
          env:
            - name: QUARKUS_HTTP_ACCESS_LOG_ENABLED
              value: "true"
            - name: QUARKUS_HTTP_ACCESS_LOG_EXCLUDE_PATTERN
              value: "/login\\.html|/q/openapi"
            - name: QUARKUS_HTTP_AUTH_SESSION_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: timefold-session-secret
                  key: SESSION_ENCRYPTION_KEY
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /deployments/data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /q/openapi
              port: 8080
            failureThreshold: 3
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /q/openapi
              port: 8080
            failureThreshold: 3
            initialDelaySeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: timefold-data
        - name: tmp
          emptyDir: {}
      initContainers:
        - name: init-permission
          image: busybox:1.38
          command: ["sh", "-c", "chown -R 999:999 /deployments/data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
          - name: data
            mountPath: /deployments/data
